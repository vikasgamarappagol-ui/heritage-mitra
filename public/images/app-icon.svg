<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0D1B2A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners (App Icon shape) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer halo ring -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.3" />

  <!-- Gopuram / Chalukyan Temple Silhouette -->
  <g filter="url(#glow)">
    <!-- Kalasha / Finial Pinnacle -->
    <path d="M256 70 L262 90 L250 90 Z" fill="url(#goldGrad)" />
    <circle cx="256" cy="65" r="5" fill="#FDE047" />

    <!-- Tier 1 (Apex) -->
    <path d="M236 94 L276 94 L282 120 L230 120 Z" fill="url(#goldGrad)" />
    <!-- Tier 2 -->
    <path d="M222 124 L290 124 L298 155 L214 155 Z" fill="url(#goldGrad)" />
    <!-- Tier 3 -->
    <path d="M206 160 L306 160 L316 196 L196 196 Z" fill="url(#goldGrad)" />
    <!-- Tier 4 -->
    <path d="M188 202 L324 202 L336 242 L176 242 Z" fill="url(#goldGrad)" />

    <!-- Temple Sanctum Gateway / Arch -->
    <path d="M170 248 L342 248 L342 290 L170 290 Z" fill="url(#goldGrad)" />
    <path d="M226 290 L226 255 Q256 242 286 255 L286 290 Z" fill="#0D1B2A" />

    <!-- Lotus Base -->
    <path d="M256 280 C230 300 170 305 150 285 C175 320 220 330 256 335 C292 330 337 320 362 285 C342 305 282 300 256 280 Z" fill="url(#goldGrad)" />
    <path d="M256 295 C240 310 200 318 185 305 C205 328 238 335 256 338 C274 335 307 328 327 305 C312 318 272 310 256 295 Z" fill="#FDE047" />
  </g>

  <!-- Title Text: Heritage ಮಿತ್ರ -->
  <text x="256" y="385" font-family="'Outfit', 'Noto Sans Kannada', sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
    HERITAGE
  </text>
  <text x="256" y="435" font-family="'Noto Sans Kannada', 'Outfit', sans-serif" font-weight="700" font-size="38" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">
    ಮಿತ್ರ
  </text>
  <text x="256" y="475" font-family="'Outfit', sans-serif" font-weight="500" font-size="16" fill="#94A3B8" text-anchor="middle" letter-spacing="4">
    BAGALKOTE TOURISM
  </text>
</svg>
