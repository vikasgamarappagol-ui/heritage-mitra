<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Heritage Mitra QR Code Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
</head>
<body>
<canvas id="qr" width="600" height="600"></canvas>
<script>
  const url = 'http://10.149.73.226:3000';
  QRCode.toCanvas(document.getElementById('qr'), url, {
    width: 600,
    margin: 2,
    color: { dark: '#0D1B2A', light: '#FFFFFF' },
    errorCorrectionLevel: 'H'
  }, function(error) {
    if (error) console.error(error);
    else console.log('QR generated for: ' + url);
  });
</script>
</body>
</html>
